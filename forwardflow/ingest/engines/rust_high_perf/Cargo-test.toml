[package]
name = "rust_high_perf_engine_test"
version = "0.1.0"
edition = "2021"
description = "High-performance file transfer engine test suite"
license = "MIT"

[dependencies]
# Async runtime and I/O
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# File system operations
walkdir = "2.4"
filetime = "0.2"
fs-err = "2.11"

# Cross-platform path handling
path-clean = "0.1"
path-slash = "0.2"

# Hashing and verification
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
sha3 = "0.10"
md5 = "0.7"
blake3 = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Threading and synchronization
rayon = "1.8"
parking_lot = "0.12"
num_cpus = "1.16"

# Memory management
bytes = "1.5"
memmap2 = "0.9"

# Advanced threading and channels
crossbeam = "0.8"
crossbeam-channel = "0.5"
futures = "0.3"

# High-performance data structures
dashmap = "5.5"
ahash = "0.8"

# Platform-specific features
cfg-if = "1.0"

# Testing utilities
tempfile = "3.8"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winbase", "fileapi", "handleapi", "processthreadsapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"